<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Void Spheres Duel</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
  <script type="module" src="./game.js"></script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="panel"><span>بازیکن ۱</span><b id="p1">100</b><small id="s1">0 امتیاز</small></div>
    <div class="panel"><span>بازیکن ۲</span><b id="p2">100</b><small id="s2">0 امتیاز</small></div>
    <div class="panel wide"><span>وضعیت</span><b id="status">اتصال...</b></div>
  </div>
  <div id="overlay" class="show">
    <div class="card">
      <p class="eyebrow">Void Spheres Duel</p>
      <h1>دوئل آنلاین روی کره‌ها</h1>
      <p>نفر اول بازیکن ۱ و نفر دوم بازیکن ۲ می‌شود. با W A S D حرکت کن، Space بپر، کلیک کن برای شلیک.</p>
      <button id="start">شروع بازی</button>
    </div>
  </div>
</body>
</html>
