<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Speedy jumper is a fast two-minute arena game with sphere jumping, Rift Surges, streaks, and rewards."
    />
    <meta name="theme-color" content="#02050d" />
    <title>Speedy jumper</title>
    <link rel="canonical" href="https://void-spheres.abghari.com/" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #02050d;
        --panel: rgba(8, 18, 32, 0.9);
        --text: #f4fbff;
        --muted: #a9bdca;
        --accent: #6ff7dd;
        --accent-strong: #16cdaa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        color: var(--text);
        background:
          radial-gradient(circle at 18% 20%, rgba(42, 213, 255, 0.22), transparent 30%),
          radial-gradient(circle at 82% 72%, rgba(255, 115, 55, 0.18), transparent 28%),
          linear-gradient(145deg, #02050d, #07152b 55%, #111025);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body::before,
      body::after {
        position: fixed;
        z-index: -1;
        width: 320px;
        height: 320px;
        content: "";
        border: 1px solid rgba(111, 247, 221, 0.28);
        border-radius: 50%;
        box-shadow:
          inset 0 0 60px rgba(111, 247, 221, 0.08),
          0 0 80px rgba(73, 206, 255, 0.12);
      }

      body::before {
        top: -110px;
        right: -90px;
      }

      body::after {
        bottom: -150px;
        left: -110px;
        width: 420px;
        height: 420px;
        border-color: rgba(255, 145, 72, 0.2);
      }

      main {
        width: min(760px, calc(100vw - 32px));
        margin: 32px auto;
        padding: clamp(30px, 7vw, 64px);
        text-align: center;
        border: 1px solid rgba(111, 247, 221, 0.2);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--accent);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 12vw, 6.5rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      .lead {
        max-width: 590px;
        margin: 26px auto 34px;
        color: var(--muted);
        font-size: clamp(1rem, 3vw, 1.2rem);
        line-height: 1.7;
      }

      .features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 0 0 34px;
        padding: 0;
        list-style: none;
      }

      .features li {
        padding: 16px 10px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.035);
        color: #dff9f4;
        font-size: 0.9rem;
      }

      .store-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 58px;
        padding: 0 28px;
        border-radius: 14px;
        color: #021b16;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        box-shadow: 0 16px 38px rgba(20, 205, 170, 0.28);
        font-weight: 800;
        text-decoration: none;
        transition: transform 150ms ease, box-shadow 150ms ease;
      }

      .store-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 44px rgba(20, 205, 170, 0.38);
      }

      footer {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 32px;
        font-size: 0.9rem;
      }

      footer a {
        color: var(--muted);
      }

      footer a:hover {
        color: var(--accent);
      }

      @media (max-width: 600px) {
        .features {
          grid-template-columns: 1fr;
        }

        footer {
          flex-direction: column;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Two-minute jumping duel</p>
      <h1>Speedy<br />jumper</h1>
      <p class="lead">
        Jump between moving spheres, defeat red units, build score streaks, collect Rift Shards,
        and unleash Surge before the timer ends.
      </p>
      <ul class="features" aria-label="Game features">
        <li>Fast arena matches</li>
        <li>Rift Surge powers</li>
        <li>Streaks and rewards</li>
      </ul>
      <a
        class="store-link"
        href="https://apps.apple.com/tr/app/speedy-jumper/id6774966205"
        target="_blank"
        rel="noopener noreferrer"
      >
        Download on the App Store
      </a>
      <footer>
        <a href="./support.html">Support</a>
        <a href="./privacy.html">Privacy Policy</a>
      </footer>
    </main>
  </body>
</html>
